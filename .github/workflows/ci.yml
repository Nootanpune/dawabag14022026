# Dawabag CI: every push and pull request is type-checked, unit-tested, migrated on an
# empty database and run end to end against the fake providers (no real service is
# called, no secret is needed). The web app is type-checked, linted and built.
name: CI

on:
  push:
  pull_request:

# The jobs only read the code: the workflow token gets no write access. The only secrets
# are the optional Android upload key (mobile job, passed through env:, never pasted into
# a script); fork pull requests never see them
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawabag_user
          POSTGRES_PASSWORD: dawabag_dev_only
          POSTGRES_DB: dawabag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dawabag_user" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools >/dev/null
      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities (high and critical fail the build)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit -p .
      - name: Unit tests
        working-directory: backend
        run: npx jest --ci
      - name: Migrations, API and end-to-end suites
        run: |
          . scripts/dev-env.sh
          scripts/dev-up.sh
          cd backend && npm run -s test:smoke
      - name: Migrations apply twice (re-runnable)
        run: |
          . scripts/dev-env.sh
          cd backend && MIGRATIONS_DIR="$GITHUB_WORKSPACE/database" npx ts-node --transpile-only src/db/migrate.ts
      - name: API log
        if: failure()
        run: tail -200 /tmp/dawabag-api.log || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  browser:
    # The website in a real browser (Chromium, desktop and phone sizes) against the API:
    # sign-in, search, product page, the server-held cart, admin access, no browser
    # storage, and WCAG 2.1 AA accessibility of the public pages (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawabag_user
          POSTGRES_PASSWORD: dawabag_dev_only
          POSTGRES_DB: dawabag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dawabag_user" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools >/dev/null
      - name: API, website and browser tests
        run: |
          . scripts/dev-env.sh
          (cd backend && npm ci --no-audit --no-fund)
          scripts/dev-up.sh
          # dev-env.sh sets NODE_ENV=development for the API; the website is built and served as production
          (cd frontend-web && npm ci --no-audit --no-fund && NODE_ENV=production NEXT_PUBLIC_API_URL=$API_URL npm run build)
          (cd frontend-web && NODE_ENV=production setsid nohup npx next start -p 3000 </dev/null >/tmp/dawabag-web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2; done
          cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Debug APK for testers; API address from the repository variable MOBILE_API_URL
      # (Settings → Secrets and variables → Actions → Variables), else the Android emulator's host
      - name: Build debug APK
        # Passed through the environment, never pasted into the script
        env:
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL || 'http://10.0.2.2:4000' }}
        run: flutter build apk --debug --dart-define=API_URL="$MOBILE_API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: dawabag-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      # Signed release bundle for Google Play — only when the upload key is in the repository
      # secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD) and MOBILE_API_URL is https (docs/RUNBOOK.md 7b). Otherwise these
      # steps are skipped and CI stays green. Fork pull requests never see the secrets.
      - name: Release signing configured?
        id: signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
        run: |
          if [ "$HAS_KEYSTORE" != true ]; then
            echo "::notice::No Android upload key in the repository secrets; release bundle not built (RUNBOOK 7b)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ "$MOBILE_API_URL" != https://* ]]; then
            echo "::notice::Release bundle skipped: the variable MOBILE_API_URL must be an https:// address for a release build"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL }}
        run: |
          # The keystore exists only in the runner's temp dir, only for this step
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/dawabag-upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          # Play needs a new version code for every upload: the CI run number
          flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_URL="$MOBILE_API_URL"
      - name: Remove the upload key
        if: always() && steps.signing.outputs.enabled == 'true'
        run: rm -f "$RUNNER_TEMP/dawabag-upload.jks"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: dawabag-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

  staging:
    # The staging stack exactly as a server runs it (deploy/staging): both images built,
    # migrations on an empty database, Caddy with its own CA in front, checked over HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_DOMAIN: www.dawabag.test
      API_DOMAIN: api.dawabag.test
      CURL_EXTRA: >-
        -k --resolve www.dawabag.test:443:127.0.0.1 --resolve api.dawabag.test:443:127.0.0.1
        --resolve www.dawabag.test:80:127.0.0.1 --resolve api.dawabag.test:5432:127.0.0.1 --resolve api.dawabag.test:6379:127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway staging settings
        run: |
          cp deploy/staging/staging.env.example deploy/staging/staging.env
          r() { openssl rand -hex 24; }
          sed -i "s/^WEB_DOMAIN=.*/WEB_DOMAIN=$WEB_DOMAIN/; s/^API_DOMAIN=.*/API_DOMAIN=$API_DOMAIN/" deploy/staging/staging.env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(r)/; s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$(r)/; s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=$(r)/" deploy/staging/staging.env
          echo "CADDY_GLOBAL_OPTIONS=local_certs" >> deploy/staging/staging.env
      - name: Build and start the stack
        run: docker compose -f deploy/staging/compose.yml --env-file deploy/staging/staging.env up -d --build --wait --wait-timeout 300
      - name: Checks through the front door
        run: |
          for i in $(seq 1 30); do curl -sf $CURL_EXTRA https://$API_DOMAIN/ready >/dev/null && break; sleep 2; done
          deploy/staging/check.sh
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/staging/compose.yml --env-file deploy/staging/staging.env logs --tail 80
