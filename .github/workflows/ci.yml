# Dawabag CI: every push and pull request is type-checked, unit-tested, migrated on an
# empty database and run end to end against the fake providers (no real service is
# called, no secret is needed). The web app is type-checked, linted and built.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawabag_user
          POSTGRES_PASSWORD: dawabag_dev_only
          POSTGRES_DB: dawabag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dawabag_user" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools >/dev/null
      - name: Install
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit -p .
      - name: Unit tests
        working-directory: backend
        run: npx jest --ci
      - name: Migrations, API and end-to-end suites
        run: |
          . scripts/dev-env.sh
          scripts/dev-up.sh
          cd backend && npm run -s test:smoke
      - name: Migrations apply twice (re-runnable)
        run: |
          . scripts/dev-env.sh
          cd backend && MIGRATIONS_DIR="$GITHUB_WORKSPACE/database" npx ts-node --transpile-only src/db/migrate.ts
      - name: API log
        if: failure()
        run: tail -200 /tmp/dawabag-api.log || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
