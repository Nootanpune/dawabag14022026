# Dawabag — run the whole stack locally, the same way it runs in the cloud:
#   cp backend/.env.example backend/.env   (fill in the keys)
#   docker compose up -d --build
# API: http://localhost:4000/health and /ready · Website: http://localhost:3000
# The API applies pending database migrations on start (database/NN_*.sql).
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dawabag
      POSTGRES_USER: dawabag_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dawabag_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawabag_user -d dawabag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Cache, OTPs and job queues only — the database is the record of truth
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dawabag
      DB_USER: dawabag_user
      DB_PASSWORD: ${DB_PASSWORD:-dawabag_dev_password}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
